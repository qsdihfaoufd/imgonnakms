<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MY MUSIC ZONE</title>

    <link rel="stylesheet" href="fun-stuff.css">
    <script src="fun-stuff.js>"></script>

</head>


<body>

<div class="desktop">


    <!-- =================================
         TOP DESKTOP BAR
    ================================== -->

    <div class="desktop-bar">

        <span>★ MY COMPUTER</span>

        <span>♫ MUSIC + TETRIS ZONE</span>

        <span>_ □ ×</span>

    </div>



    <!-- =================================
         MAIN LAYOUT
    ================================== -->

    <main class="main-window">


        <!-- =================================
             MUSIC PLAYER
        ================================== -->

        <section class="mp3-player">


            <!-- TITLE BAR -->

            <div class="player-titlebar">

                <span>♫ MP3 PLAYER</span>

                <span>_ □ ×</span>

            </div>



            <!-- PLAYER SCREEN -->

            <div class="player-screen">

                <div class="album-art">

                    <img
                        src="https://i.pinimg.com/736x/0e/b9/81/0eb9814d6ceb52d345919f7dd921b4a6.jpg"
                        id="album-image"
                        alt=""
                    >

                </div>


                <div class="track-info">

                    <div class="now-playing">
                        NOW PLAYING
                    </div>

                    <div
                        class="song-title"
                        id="song-title"
                    >
                        Select a song
                    </div>

                    <div
                        class="artist"
                        id="artist"
                    >
                        ♪ ♪ ♪
                    </div>

                </div>

            </div>



            <!-- SEEK BAR -->

            <div class="seek-area">

                <span id="current-time">
                    0:00
                </span>

                <input
                    type="range"
                    id="seek-bar"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">
                    0:00
                </span>

            </div>



            <!-- CONTROLS -->

            <div class="controls">

                <button id="shuffle">
                    🔀
                </button>

                <button id="previous">
                    |◀
                </button>

                <button
                    id="play"
                    class="play-button"
                >
                    ▶
                </button>

                <button id="next">
                    ▶|
                </button>

                <button id="mute">
                    🔊
                </button>

            </div>



            <!-- VOLUME -->

            <div class="volume">

                <span>VOL</span>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.7"
                >

            </div>



            <!-- PLAYLIST -->

            <div class="playlist-title">

                ♪ PLAYLIST

            </div>

            <div
                class="playlist"
                id="playlist"
            ></div>


        </section>



        <!-- =================================
             TETRIS
        ================================== -->

        <section class="tetris-window">


            <div class="tetris-titlebar">

                <span>🧩 TETRIS.EXE</span>

                <span>_ □ ×</span>

            </div>


            <div class="tetris-content">


                <div class="game-area">

                    <canvas
                        id="tetris"
                        width="240"
                        height="480"
                    ></canvas>

                </div>


                <div class="game-info">

                    <div class="score-box">

                        <span>SCORE</span>

                        <strong id="score">
                            0
                        </strong>

                    </div>


                    <div class="score-box">

                        <span>LINES</span>

                        <strong id="lines">
                            0
                        </strong>

                    </div>


                   <button id="start">
    START
</button>

<button id="reset">
    RESET
</button>


                    <div class="controls-help">

                        <strong>CONTROLS</strong>

                        <p>← → MOVE</p>
                        <p>↓ DOWN</p>
                        <p>↑ ROTATE</p>
                        <p>SPACE DROP</p>

                    </div>

                </div>

            </div>

        </section>


    </main>



    <!-- =================================
         FOOTER
    ================================== -->

    <footer>

        <span>
            ♪ welcome to my little music corner ♪
        </span>

        <span>
            SYSTEM ONLINE
        </span>

    </footer>


</div>


<!-- AUDIO -->

<audio id="audio"></audio>




<script src="fun-stuff.js"></script>
<script src="tetris.js"></script>
</body>

</html>
